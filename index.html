<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVOM Gargalo Mental</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
        body {
            background: #0B0A08;
            font-family: 'Inter', sans-serif;
        }
        .font-fraunces {
            font-family: 'Fraunces', serif;
        }
        .bg-dark {
            background: #0B0A08;
        }
        .border-gold {
            border-color: #B8912B;
        }
        .text-gold {
            color: #B8912B;
        }
        .text-light {
            color: #F3ECDD;
        }
        .text-muted {
            color: #93897A;
        }
        .text-body {
            color: #B7AF9F;
        }
        .bg-card {
            background: #141109;
        }
        .btn-gold {
            background: #B8912B;
            color: #0B0A08;
        }
        .btn-gold:hover {
            background: #D4AF37;
        }
        .btn-outline {
            border: 1px solid #3A2A1E;
            color: #93897A;
        }
        .btn-outline:hover {
            border-color: #B8912B;
            color: #D4AF37;
        }
        .radar-ring {
            stroke: #3A3427;
        }
        .radar-axis {
            stroke: #3A3427;
        }
        .radar-polygon {
            fill: rgba(201, 162, 39, 0.18);
            stroke: #B8912B;
            stroke-width: 2;
        }
        .highlight-weak {
            fill: #A23E2E;
            stroke: #E8B4A6;
            stroke-width: 2;
        }
        .highlight-strong {
            fill: #D4AF37;
        }
        .progress-bar {
            background: #241F16;
            height: 2px;
        }
        .progress-fill {
            background: linear-gradient(90deg, #6B5217, #D4AF37);
            height: 100%;
            transition: width 0.5s;
        }
        input,
        textarea {
            background: #141109;
            border: 1px solid #2B2619;
            color: #E4DDCC;
            padding: 0.75rem;
            border-radius: 0.25rem;
            width: 100%;
            font-size: 0.875rem;
        }
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #B8912B;
        }
        button {
            cursor: pointer;
        }
        .step-transition {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen w-full flex items-center justify-center px-4 py-10 bg-dark"></div>

    <script>
        // ---------- DADOS ----------
        const PILLARS = {
            confianca: { label: "Autoconfiança", short: "confiança" },
            mentalidade: { label: "Mentalidade", short: "mentalidade" },
            atitude: { label: "Atitude", short: "atitude" },
            acao: { label: "Ação", short: "ação" },
        };

        const QUESTIONS = [
            { id: 1, pillar: "confianca", reverse: false,
            text: "Quando encaro um desafio novo, acredito que sou capaz de aprender o que for preciso." },
            { id: 2, pillar: "confianca", reverse: true,
            text: "Decisões difíceis me paralisam mais do que me movem." },
            { id: 3, pillar: "confianca", reverse: false,
            text: "Costumo reconhecer minhas pequenas vitórias, não só as grandes." },
            { id: 4, pillar: "mentalidade", reverse: false,
            text: "Encaro um “não” como informação, não como rejeição pessoal." },
            { id: 5, pillar: "mentalidade", reverse: true,
            text: "Quando algo dá errado, minha primeira reação é procurar culpados." },
            { id: 6, pillar: "mentalidade", reverse: false,
            text: "Consigo ver oportunidade onde outros só veem obstáculo." },
            { id: 7, pillar: "atitude", reverse: false,
            text: "Mantenho o foco no que posso controlar, mesmo em dias difíceis." },
            { id: 8, pillar: "atitude", reverse: true,
            text: "Deixo o desânimo tomar conta por dias antes de agir de novo." },
            { id: 9, pillar: "atitude", reverse: false,
            text: "As pessoas ao meu redor me impulsionam mais do que me travam." },
            { id: 10, pillar: "acao", reverse: false,
            text: "Transformo minhas metas em passos concretos, com prazo." },
            { id: 11, pillar: "acao", reverse: true,
            text: "Adio o que mais importa até não ter mais escolha." },
            { id: 12, pillar: "acao", reverse: false,
            text: "Quando decido algo, normalmente ajo dentro da mesma semana." },
        ];

        const SCALE = [
            { v: 1, label: "Discordo totalmente" },
            { v: 2, label: "Discordo" },
            { v: 3, label: "Neutro" },
            { v: 4, label: "Concordo" },
            { v: 5, label: "Concordo totalmente" },
        ];

        const GARGALO_CONTENT = {
            confianca: {
                title: "A voz que exige provar seu valor",
                body: "Sua raiz mais fina hoje é a autoconfiança. Não é falta de capacidade — é um padrão que aprende, cedo, que só se é aceito depois de provar algo. Isso trava a ação antes mesmo dela começar.",
                reflect: "Desde quando você sente que precisa provar seu valor antes de agir? O que aconteceria se você agisse mesmo sem essa prova?",
                steps: [
                    "Escolha 1 ação pequena esta semana que você vem adiando por insegurança — e faça sem esperar se sentir “pronto”.",
                    "No fim de cada dia, anote 1 vitória, por menor que pareça.",
                    "Identifique 1 pessoa no seu círculo que fortalece sua confiança — e busque mais tempo perto dela.",
                ]
            },
            mentalidade: {
                title: "O medo do próprio sucesso",
                body: "Sua raiz mais fina é a mentalidade. Muitas vezes não é o fracasso que trava — é o medo do que a mudança exige de você. Crescer também assusta.",
                reflect: "O que você teme que aconteça se as coisas derem certo? Que responsabilidade nova isso traria?",
                steps: [
                    "Escreva o pior cenário real de “dar certo” — e note o quanto dele é fato e o quanto é suposição.",
                    "Na próxima vez que ouvir um “não”, escreva 1 informação útil que ele te deu.",
                    "Escolha uma situação recente difícil e reescreva-a como aprendizado, não como derrota.",
                ]
            },
            atitude: {
                title: "O ciclo do desânimo",
                body: "Sua raiz mais fina é a atitude diária. O problema não é sentir desânimo — todo mundo sente. É o tempo que ele fica no comando antes de você retomar o volante.",
                reflect: "Quando o desânimo bate, o que ele te impede de fazer primeiro? O que costuma te tirar dali?",
                steps: [
                    "Defina 1 hábito diário de 5 minutos (gratidão, caminhada, respiração) para os dias difíceis.",
                    "Identifique o gatilho mais comum do seu desânimo e escreva 1 resposta padrão para ele.",
                    "Reserve 1 pessoa de confiança para avisar quando perceber que está travando.",
                ]
            },
            acao: {
                title: "Sonho sem chão",
                body: "Sua raiz mais fina é a ação. As ideias existem, a vontade existe — o que falta é o passo concreto que tira o objetivo do campo da imaginação.",
                reflect: "O que você mais adia hoje? O que esse adiamento já te custou até agora?",
                steps: [
                    "Pegue seu objetivo mais adiado e quebre-o em 1 passo que caiba nesta semana.",
                    "Marque um prazo real — com data — para esse primeiro passo.",
                    "Avise alguém sobre esse prazo, para criar compromisso externo.",
                ]
            }
        };

        // ---------- ESTADO ----------
        let state = {
            step: 'splash', // splash, intro, quiz, result, reflect, paywall, account, checkin
            qIndex: 0,
            answers: {}, // { questionId: value }
            ownAnswer: '',
            account: { name: '', email: '', whatsapp: '' },
            checkinDone: null,
            checkinNote: '',
            checkinSaved: false,
        };

        // ---------- AUXILIARES ----------
        function computeScores(answers) {
            const totals = { confianca: 0, mentalidade: 0, atitude: 0, acao: 0 };
            const counts = { confianca: 0, mentalidade: 0, atitude: 0, acao: 0 };
            QUESTIONS.forEach(q => {
                const raw = answers[q.id];
                if (raw == null) return;
                const val = q.reverse ? 6 - raw : raw;
                totals[q.pillar] += val;
                counts[q.pillar] += 1;
            });
            const scores = {};
            Object.keys(totals).forEach(k => {
                scores[k] = counts[k] ? totals[k] / counts[k] : 0;
            });
            return scores;
        }

        function getWeakest(scores) {
            let min = null,
                minVal = Infinity;
            Object.keys(scores).forEach(k => {
                if (scores[k] < minVal) { minVal = scores[k];
                    min = k; }
            });
            return min;
        }

        function getStrongest(scores, weakest) {
            let max = null,
                maxVal = -Infinity;
            Object.keys(scores).forEach(k => {
                if (k === weakest) return;
                if (scores[k] > maxVal) { maxVal = scores[k];
                    max = k; }
            });
            return max;
        }

        function getContent(weakest) {
            return weakest ? GARGALO_CONTENT[weakest] : null;
        }

        function getProgress() {
            if (state.step === 'quiz') return (state.qIndex / QUESTIONS.length) * 100;
            if (state.step === 'result' || state.step === 'reflect' || state.step === 'paywall' || state.step === 'account' ||
                state.step === 'checkin') return 100;
            return 0;
        }

        // ---------- RENDER ----------
        function render() {
            const app = document.getElementById('app');
            const progress = getProgress();
            const scores = computeScores(state.answers);
            const weakest = getWeakest(scores);
            const strongest = getStrongest(scores, weakest);
            const content = getContent(weakest);
            const currentQ = QUESTIONS[state.qIndex];

            let html = '';

            const showBack = state.step !== 'splash';
            const showProgress = state.step === 'quiz' || state.step === 'result' || state.step === 'reflect' || state.step ===
                'paywall' || state.step === 'account' || state.step === 'checkin';

            html += `<div class="w-full max-w-xl mx-auto">`;

            if (showBack) {
                html += `<div class="flex items-center gap-3 mb-10">
              <button onclick="goBack()" class="shrink-0 text-muted hover:text-gold transition-colors" aria-label="Voltar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <span class="text-[10px] uppercase tracking-[0.18em] text-muted shrink-0">OVOM · Gargalo Mental</span>
              ${showProgress ? `<div class="flex-1 progress-bar relative"><div class="progress-fill" style="width:${progress}%"></div></div>` : ''}
            </div>`;
            }

            // ----- TELAS -----
            if (state.step === 'splash') {
                html += `
                <div class="text-center cursor-pointer" onclick="setStep('intro')">
                  <h1 class="font-fraunces text-4xl sm:text-6xl leading-[1.1] font-semibold mb-3 text-light">
                    OVOM <span class="text-gold">Gargalo Mental</span>
                  </h1>
                  <p class="font-fraunces text-gold text-lg sm:text-xl italic max-w-md mx-auto mb-6">
                    Existe uma raiz travando sua vida agora — e você ainda não sabe qual é.
                  </p>
                  <p class="text-xs uppercase text-muted tracking-[0.14em] mt-2 animate-pulse">toque para começar</p>
                </div>
                <a href="https://instagram.com/eusoucarlosgomes01" target="_blank" rel="noopener noreferrer" class="fixed bottom-8 left-0 right-0 text-center text-xs text-muted underline hover:text-gold transition-colors font-inter">
                  Siga @eusoucarlosgomes01 no Instagram
                </a>
              `;
            } else if (state.step === 'intro') {
                html += `
                <div class="text-center">
                  <div class="flex justify-center mb-8">
                    <img src="https://m.media-amazon.com/images/I/71s1T3w0J7L._AC_UF1000,1000_QL80_.jpg" alt="Capa do livro Ou Vende ou Morre" class="w-32 sm:w-36 rounded-sm shadow-2xl" style="box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,162,39,0.3);" />
                  </div>
                  <h1 class="font-fraunces text-4xl sm:text-5xl leading-[1.1] font-semibold mb-3 text-light">
                    OVOM <span class="text-gold">Gargalo Mental</span>
                  </h1>
                  <p class="text-sm sm:text-base font-semibold tracking-wide mb-6 text-gold">O teste que mostra onde a sua mente trava — e o que fazer para destravar.</p>
                  <p class="text-base leading-relaxed mb-2 max-w-md mx-auto text-body">12 perguntas. Sem certo ou errado. O objetivo não é te avaliar — é mostrar qual raiz da sua vida está mais fraca hoje: confiança, mentalidade, atitude ou ação.</p>
                  <p class="text-sm italic mb-3 text-muted font-fraunces">“A venda mais importante não é a de um produto. É a de acreditar em si mesmo.”</p>
                  <p class="text-xs uppercase tracking-widest mb-10 text-muted">baseado no livro de Carlos Gomes</p>
                  <button onclick="setStep('quiz')" class="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm btn-gold transition-colors">Começar diagnóstico</button>
                </div>
              `;
            } else if (state.step === 'quiz' && currentQ) {
                html += `
                <div>
                  <span class="text-xs mb-4 block text-muted">${String(qIndex + 1).padStart(2, '0')} / ${String(QUESTIONS.length).padStart(2, '0')}</span>
                  <h2 class="font-fraunces text-2xl sm:text-3xl leading-snug font-medium mb-10 min-h-[5rem] text-light">${currentQ.text}</h2>
                  <div class="flex flex-col gap-2">
                    ${SCALE.map(s => `
                      <button onclick="selectAnswer(${s.v})" class="text-left px-5 py-3 border rounded-sm text-sm hover:border-gold transition-colors flex items-center justify-between" style="background: ${state.answers[currentQ.id] === s.v ? 'rgba(201,162,39,0.15)' : '#141109'}; border-color: ${state.answers[currentQ.id] === s.v ? '#B8912B' : '#2B2619'}; color: #E4DDCC;">
                        <span>${s.label}</span>
                        <span class="text-xs text-muted">${s.v}</span>
                      </button>
                    `).join('')}
                  </div>
                </div>
              `;
            } else if (state.step === 'result' && content) {
                html += `
                <div>
                  <div class="flex justify-center mb-8">
                    ${drawRadar(scores, weakest)}
                  </div>
                  <p class="text-xs uppercase tracking-widest text-center mb-2 text-muted">Sua raiz mais fina agora</p>
                  <h2 class="font-fraunces text-3xl font-semibold text-center mb-6" style="color: #D9776A;">${content.title}</h2>
                  <p class="text-base leading-relaxed mb-4 text-center max-w-md mx-auto text-body">${content.body}</p>
                  <p class="text-sm italic text-center mb-2 max-w-md mx-auto text-muted font-fraunces">Isso não é quem você é — é onde você está agora. Toda raiz fina pode engrossar com prática.</p>
                  ${strongest ? `<p class="text-xs text-center mb-8 max-w-md mx-auto text-muted">E uma raiz já vem firme: sua <span class="text-gold">${PILLARS[strongest].label}</span> está mais forte que o resto — vale se apoiar nela.</p>` : ''}
                  <div class="flex flex-col items-center gap-3">
                    <button onclick="setStep('reflect')" class="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm btn-gold transition-colors">Ver a origem e o caminho</button>
                    <button onclick="shareWhatsApp()" class="text-xs underline text-muted hover:text-gold transition-colors flex items-center gap-1">Compartilhar resultado no WhatsApp</button>
                  </div>
                </div>
              `;
            } else if (state.step === 'reflect' && content) {
                html += `
                <div>
                  <p class="text-xs uppercase tracking-widest mb-3 text-muted">Origem — reflita antes de seguir</p>
                  <p class="font-fraunces text-2xl leading-snug italic mb-6 text-light">${content.reflect}</p>
                  <textarea id="ownAnswerInput" placeholder="Se quiser, escreva sua resposta aqui (opcional)" class="w-full border rounded-sm p-3 text-sm h-20 resize-none mb-10">${state.ownAnswer}</textarea>
                  <p class="text-xs uppercase tracking-widest mb-3 text-muted">Caminho — primeiros passos</p>
                  <ul class="mb-10 flex flex-col gap-3">
                    ${content.steps.map((s, i) => `
                      <li class="flex gap-3 items-start">
                        <span class="text-gold font-fraunces text-sm font-semibold shrink-0 mt-0.5">${i + 1}</span>
                        <span class="text-sm leading-relaxed text-body">${s}</span>
                      </li>
                    `).join('')}
                  </ul>
                  <div class="flex flex-wrap gap-3">
                    <button onclick="saveReflectionAndGoToPaywall()" class="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm btn-gold transition-colors">Ver plano completo</button>
                    <button onclick="restart()" class="px-6 py-3 text-sm border rounded-sm btn-outline transition-colors">Refazer diagnóstico</button>
                  </div>
                </div>
              `;
            } else if (state.step === 'paywall') {
                html += `
                <div>
                  <p class="text-xs uppercase tracking-widest mb-3 text-center text-muted">Plano completo</p>
                  <h2 class="font-fraunces text-3xl font-semibold text-center mb-3 text-light">Acompanhe sua raiz <span class="text-gold">mês a mês</span></h2>
                  <p class="text-sm leading-relaxed text-center mb-10 max-w-md mx-auto text-body">O diagnóstico gratuito mostra uma foto. O plano completo mostra a evolução — e te acompanha enquanto você trabalha o gargalo.</p>
                  <ul class="mb-10 flex flex-col gap-4 max-w-md mx-auto">
                    ${[
                      ["Histórico do Mapa de Raízes", "veja se a raiz mais fraca melhora mês a mês"],
                      ["Plano de 30 dias", "passos detalhados, não só os 3 iniciais"],
                      ["Check-ins periódicos", "o app pergunta se você deu o passo combinado"],
                      ["Biblioteca OVOM", "trechos do livro liberados por gargalo"],
                      ["Reavaliação mensal", "mini-diagnóstico pra medir sua evolução real"],
                    ].map(([title, desc]) => `
                      <li class="flex gap-3 items-start">
                        <span class="text-gold text-sm shrink-0 mt-0.5">✦</span>
                        <span class="text-sm"><span class="font-semibold text-light">${title}</span> <span class="text-muted">— ${desc}</span></span>
                      </li>
                    `).join('')}
                  </ul>
                  <div class="text-center mb-8">
                    <span class="font-fraunces text-4xl font-semibold text-light">R$29,90</span>
                    <span class="text-sm text-muted">/mês</span>
                    <p class="text-xs mt-1 text-muted">cancele quando quiser</p>
                  </div>
                  <div class="flex flex-col items-center gap-3">
                    <button onclick="goToAccount()" class="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm btn-gold transition-colors w-full max-w-xs">Assinar plano completo</button>
                    <button onclick="setStep('reflect')" class="text-xs underline text-muted">voltar</button>
                  </div>
                </div>
              `;
            } else if (state.step === 'account') {
                html += `
                <div>
                  <p class="text-xs uppercase tracking-widest mb-3 text-center text-muted">Quase lá</p>
                  <h2 class="font-fraunces text-3xl font-semibold text-center mb-3 text-light">Crie sua conta</h2>
                  <p class="text-sm leading-relaxed text-center mb-8 max-w-md mx-auto text-body">É com esses dados que você acessa seu histórico depois, e recebe o link do grupo exclusivo no WhatsApp assim que o pagamento for confirmado.</p>
                  <div class="flex flex-col gap-3 max-w-sm mx-auto mb-8">
                    <input id="accountName" type="text" placeholder="Nome completo" value="${state.account.name}" />
                    <input id="accountEmail" type="email" placeholder="E-mail" value="${state.account.email}" />
                    <input id="accountWhatsapp" type="tel" placeholder="WhatsApp (com DDD)" value="${state.account.whatsapp}" />
                  </div>
                  <div class="flex flex-col items-center gap-3">
                    <button onclick="submitAccount()" class="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm btn-gold transition-colors w-full max-w-sm">Continuar para pagamento</button>
                    <button onclick="setStep('paywall')" class="text-xs underline text-muted">voltar</button>
                  </div>
                </div>
              `;
            } else if (state.step === 'checkin') {
                html += `
                <div>
                  <p class="text-xs uppercase tracking-widest mb-3 text-center text-muted">Semana 1 · ${content ? PILLARS[weakest].label : ''}</p>
                  <h2 class="font-fraunces text-2xl font-semibold text-center mb-8 text-light">Check-in</h2>
                  <div class="rounded-sm border p-5 mb-8" style="border-color: #2B2619; background: #141109;">
                    <p class="text-xs uppercase tracking-widest mb-2 text-muted">Passo combinado</p>
                    <p class="text-sm leading-relaxed text-light">${content ? content.steps[0] : ''}</p>
                  </div>
                  <p class="text-sm mb-4 text-center text-body">Você deu esse passo essa semana?</p>
                  <div class="flex gap-3 justify-center mb-8">
                    <button onclick="setCheckinDone(true)" class="px-6 py-2 border rounded-sm text-sm hover:border-gold transition-colors" style="background: ${state.checkinDone === true ? 'rgba(184,145,43,0.15)' : '#141109'}; border-color: ${state.checkinDone === true ? '#B8912B' : '#2B2619'}; color: #E4DDCC;">Dei o passo</button>
                    <button onclick="setCheckinDone(false)" class="px-6 py-2 border rounded-sm text-sm hover:border-[#A23E2E] transition-colors" style="background: ${state.checkinDone === false ? 'rgba(162,62,46,0.15)' : '#141109'}; border-color: ${state.checkinDone === false ? '#A23E2E' : '#2B2619'}; color: #E4DDCC;">Ainda não</button>
                  </div>
                  ${state.checkinDone !== null && !state.checkinSaved ? `
                    <div class="mb-8">
                      <textarea id="checkinNote" placeholder="${state.checkinDone ? 'Como foi? (opcional)' : 'O que travou? (opcional)'}" class="w-full border rounded-sm p-3 text-sm h-20 resize-none">${state.checkinNote}</textarea>
                      <div class="flex justify-center mt-4">
                        <button onclick="saveCheckin()" class="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm btn-gold transition-colors">Salvar check-in</button>
                      </div>
                    </div>
                  ` : ''}
                  ${state.checkinSaved ? `
                    <div class="text-center mb-8">
                      <p class="font-fraunces text-lg italic mb-2 text-gold">Check-in registrado.</p>
                      <p class="text-sm text-muted">Volte em 30 dias e refaça o diagnóstico para reavaliar sua raiz.</p>
                      <button onclick="startReassessment()" class="text-xs underline mt-3 text-muted hover:text-gold transition-colors">Simular reavaliação agora (teste)</button>
                    </div>
                  ` : ''}
                  <div class="flex justify-center">
                    <button onclick="restart()" class="px-6 py-3 text-sm border rounded-sm btn-outline transition-colors">Refazer diagnóstico</button>
                  </div>
                </div>
              `;
            }

            html += `</div>`;
            app.innerHTML = html;

            // Sincronizar campos de texto
            if (state.step === 'reflect') {
                const ta = document.getElementById('ownAnswerInput');
                if (ta) {
                    ta.value = state.ownAnswer;
                    ta.oninput = (e) => state.ownAnswer = e.target.value;
                }
            }
            if (state.step === 'account') {
                ['accountName', 'accountEmail', 'accountWhatsapp'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.value = state.account[id.replace('account', '').toLowerCase()];
                        el.oninput = (e) => state.account[id.replace('account', '').toLowerCase()] = e.target.value;
                    }
                });
            }
            if (state.step === 'checkin') {
                const note = document.getElementById('checkinNote');
                if (note) {
                    note.value = state.checkinNote;
                    note.oninput = (e) => state.checkinNote = e.target.value;
                }
            }
        }

        // ---------- FUNÇÕES DE NAVEGAÇÃO ----------
        function setStep(step) {
            state.step = step;
            render();
        }

        function goBack() {
            if (state.step === 'intro') setStep('splash');
            else if (state.step === 'quiz') {
                if (state.qIndex > 0) state.qIndex--;
                else setStep('intro');
                render();
            } else if (state.step === 'result') {
                state.qIndex = QUESTIONS.length - 1;
                setStep('quiz');
            } else if (state.step === 'reflect') setStep('result');
            else if (state.step === 'paywall') setStep('reflect');
            else if (state.step === 'account') setStep('paywall');
            else if (state.step === 'checkin') setStep('account');
            else render();
        }

        function selectAnswer(val) {
            const q = QUESTIONS[state.qIndex];
            state.answers[q.id] = val;
            if (state.qIndex < QUESTIONS.length - 1) {
                state.qIndex++;
                render();
            } else {
                setStep('result');
            }
        }

        function restart() {
            state.answers = {};
            state.qIndex = 0;
            state.ownAnswer = '';
            state.account = { name: '', email: '', whatsapp: '' };
            state.checkinDone = null;
            state.checkinNote = '';
            state.checkinSaved = false;
            setStep('intro');
        }

        function saveReflectionAndGoToPaywall() {
            const ta = document.getElementById('ownAnswerInput');
            if (ta) state.ownAnswer = ta.value;
            setStep('paywall');
        }

        function shareWhatsApp() {
            const scores = computeScores(state.answers);
            const weakest = getWeakest(scores);
            const content = getContent(weakest);
            if (!content) return;
            const msg =
                `*OVOM · Gargalo Mental*\n\nMinha raiz mais fina hoje: *${PILLARS[weakest].label}*\n\n"${content.title}"\n\n${content.body}\n\nFaz o seu diagnóstico também 👇`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
        }

        function goToAccount() {
            setStep('account');
        }

        function submitAccount() {
            const name = document.getElementById('accountName').value.trim();
            const email = document.getElementById('accountEmail').value.trim();
            const whatsapp = document.getElementById('accountWhatsapp').value.trim();

            if (!name || !email || !whatsapp) {
                alert('Por favor, preencha todos os campos.');
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                alert('Por favor, insira um e-mail válido.');
                return;
            }

            // Normalizar WhatsApp
            const cleaned = whatsapp.replace(/\D/g, '');
            if (cleaned.length < 10) {
                alert('Por favor, insira um número de WhatsApp válido com DDD.');
                return;
            }

            state.account = { name, email, whatsapp };

            const msg =
                `Olá! Fiz o diagnóstico OVOM Gargalo Mental e quero assinar o Plano Completo de R$ 29,90/mês.\n\nNome: ${name}\nE-mail: ${email}\nWhatsApp: ${whatsapp}\n\nGostaria de receber as instruções para pagamento.`;
            const url = `https://wa.me/5594992092395?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');

            // Vai para tela de check-in (pós-assinatura simulada)
            setStep('checkin');
        }

        function setCheckinDone(val) {
            state.checkinDone = val;
            render();
        }

        function saveCheckin() {
            const note = document.getElementById('checkinNote');
            if (note) state.checkinNote = note.value;
            state.checkinSaved = true;
            render();
        }

        function startReassessment() {
            state.answers = {};
            state.qIndex = 0;
            state.ownAnswer = '';
            state.checkinDone = null;
            state.checkinNote = '';
            state.checkinSaved = false;
            setStep('quiz');
        }

        // ---------- RADAR (SVG) ----------
        function drawRadar(scores, weakest) {
            const size = 280;
            const cx = size / 2;
            const cy = size / 2;
            const maxR = 100;
            const order = ["confianca", "mentalidade", "atitude", "acao"];
            const angleFor = (i) => (Math.PI * 2 * i) / order.length - Math.PI / 2;

            const points = order.map((k, i) => {
                const r = (scores[k] / 5) * maxR;
                const a = angleFor(i);
                return {
                    key: k,
                    x: cx + r * Math.cos(a),
                    y: cy + r * Math.sin(a),
                    labelX: cx + (maxR + 34) * Math.cos(a),
                    labelY: cy + (maxR + 34) * Math.sin(a),
                };
            });

            const polygon = points.map(p => `${p.x},${p.y}`).join(" ");
            const rings = [0.25, 0.5, 0.75, 1];

            let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="overflow-visible">`;
            rings.forEach(r => {
                svg +=
                    `<circle cx="${cx}" cy="${cy}" r="${maxR * r}" fill="none" stroke="#3A3427" stroke-width="1" opacity="0.5" />`;
            });
            order.forEach((k, i) => {
                const a = angleFor(i);
                svg +=
                    `<line x1="${cx}" y1="${cy}" x2="${cx + maxR * Math.cos(a)}" y2="${cy + maxR * Math.sin(a)}" stroke="#3A3427" stroke-width="1" />`;
            });
            svg += `<polygon points="${polygon}" fill="rgba(201,162,39,0.18)" stroke="#B8912B" stroke-width="2" />`;
            points.forEach(p => {
                const isWeak = p.key === weakest;
                svg +=
                    `<circle cx="${p.x}" cy="${p.y}" r="${isWeak ? 6 : 4}" fill="${isWeak ? '#A23E2E' : '#D4AF37'}" stroke="${isWeak ? '#E8B4A6' : 'none'}" stroke-width="${isWeak ? 2 : 0}" />`;
            });
            points.forEach(p => {
                const isWeak = p.key === weakest;
                svg +=
                    `<text x="${p.labelX}" y="${p.labelY}" fill="${isWeak ? '#D9776A' : '#A89482'}" font-size="12" font-family="Inter, sans-serif" font-weight="${isWeak ? 700 : 500}" text-anchor="middle" dominant-baseline="middle">${PILLARS[p.key].label}</text>`;
            });
            svg += `</svg>`;
            return svg;
        }

        // ---------- INICIALIZAÇÃO ----------
        render();
    </script>
</body>
</html>
