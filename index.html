<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OVOM Gargalo Mental</title>
  <style>
    /* ---------- RESET E ESTILOS GLOBAIS ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0B0A08;
      color: #F3ECDD;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    #app {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }
    .btn-gold {
      background: #B8912B;
      color: #0B0A08;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      max-width: 280px;
    }
    .btn-gold:hover { background: #D4AF37; }
    .btn-outline {
      background: transparent;
      border: 1px solid #3A2A1E;
      color: #93897A;
      padding: 0.7rem 1.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-outline:hover { border-color: #B8912B; color: #D4AF37; }
    .text-gold { color: #B8912B; }
    .text-light { color: #F3ECDD; }
    .text-muted { color: #93897A; }
    .text-body { color: #B7AF9F; }
    .text-red { color: #D9776A; }
    .bg-card { background: #141109; padding: 1.5rem; border-radius: 4px; border: 1px solid #2B2619; }
    .progress-bar { height: 2px; background: #241F16; border-radius: 2px; margin: 0.5rem 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6B5217, #D4AF37); border-radius: 2px; transition: width 0.3s; }
    input, textarea {
      background: #141109;
      border: 1px solid #2B2619;
      color: #E4DDCC;
      padding: 0.7rem;
      border-radius: 4px;
      width: 100%;
      font-size: 0.9rem;
    }
    input:focus, textarea:focus { outline: none; border-color: #B8912B; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .gap-4 { gap: 1rem; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .text-center { text-align: center; }
    .text-xs { font-size: 0.7rem; }
    .text-sm { font-size: 0.85rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.2rem; }
    .text-2xl { font-size: 1.8rem; }
    .text-3xl { font-size: 2.2rem; }
    .text-4xl { font-size: 2.8rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .italic { font-style: italic; }
    .uppercase { text-transform: uppercase; }
    .tracking-widest { letter-spacing: 0.15em; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .mb-10 { margin-bottom: 2.5rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-8 { margin-top: 2rem; }
    .p-3 { padding: 0.75rem; }
    .p-5 { padding: 1.25rem; }
    .w-full { width: 100%; }
    .max-w-md { max-width: 400px; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .shrink-0 { flex-shrink: 0; }
    .border { border: 1px solid #2B2619; border-radius: 4px; }
    .cursor-pointer { cursor: pointer; }
    .hover-gold:hover { color: #D4AF37; }
    .hover-border-gold:hover { border-color: #B8912B; }
    .hover-bg-gold:hover { background: #D4AF37; }
    .hidden { display: none; }
    .animate-pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    .step-transition { transition: opacity 0.3s; }

    /* BOTÃO VOLTAR */
    .back-btn {
      background: none;
      border: none;
      color: #93897A;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.2rem 0.5rem;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #D4AF37; }

    /* LISTA DE PASSOS */
    .step-list { list-style: none; padding: 0; }
    .step-list li { display: flex; gap: 0.75rem; align-items: flex-start; margin-bottom: 0.75rem; }
    .step-list li span:first-child { color: #B8912B; font-weight: 700; }

    /* BOTÕES DE CHECK-IN */
    .checkin-btn {
      padding: 0.5rem 1.5rem;
      border-radius: 4px;
      border: 1px solid #2B2619;
      background: #141109;
      color: #E4DDCC;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .checkin-btn.active-yes { background: rgba(184,145,43,0.15); border-color: #B8912B; }
    .checkin-btn.active-no { background: rgba(162,62,46,0.15); border-color: #A23E2E; }
    .checkin-btn:hover { border-color: #B8912B; }

    .benefit-item { display: flex; gap: 0.75rem; align-items: flex-start; }
    .benefit-item .icon { color: #B8912B; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // -------------------------------------------------------------------------
    // 1. DADOS
    // -------------------------------------------------------------------------
    const PILLARS = {
      confianca: { label: "Autoconfiança", short: "confiança" },
      mentalidade: { label: "Mentalidade", short: "mentalidade" },
      atitude: { label: "Atitude", short: "atitude" },
      acao: { label: "Ação", short: "ação" },
    };

    const QUESTIONS = [
      { id: 1, pillar: "confianca", reverse: false, text: "Quando encaro um desafio novo, acredito que sou capaz de aprender o que for preciso." },
      { id: 2, pillar: "confianca", reverse: true, text: "Decisões difíceis me paralisam mais do que me movem." },
      { id: 3, pillar: "confianca", reverse: false, text: "Costumo reconhecer minhas pequenas vitórias, não só as grandes." },
      { id: 4, pillar: "mentalidade", reverse: false, text: "Encaro um “não” como informação, não como rejeição pessoal." },
      { id: 5, pillar: "mentalidade", reverse: true, text: "Quando algo dá errado, minha primeira reação é procurar culpados." },
      { id: 6, pillar: "mentalidade", reverse: false, text: "Consigo ver oportunidade onde outros só veem obstáculo." },
      { id: 7, pillar: "atitude", reverse: false, text: "Mantenho o foco no que posso controlar, mesmo em dias difíceis." },
      { id: 8, pillar: "atitude", reverse: true, text: "Deixo o desânimo tomar conta por dias antes de agir de novo." },
      { id: 9, pillar: "atitude", reverse: false, text: "As pessoas ao meu redor me impulsionam mais do que me travam." },
      { id: 10, pillar: "acao", reverse: false, text: "Transformo minhas metas em passos concretos, com prazo." },
      { id: 11, pillar: "acao", reverse: true, text: "Adio o que mais importa até não ter mais escolha." },
      { id: 12, pillar: "acao", reverse: false, text: "Quando decido algo, normalmente ajo dentro da mesma semana." },
    ];

    const SCALE = [
      { v: 1, label: "Discordo totalmente" },
      { v: 2, label: "Discordo" },
      { v: 3, label: "Neutro" },
      { v: 4, label: "Concordo" },
      { v: 5, label: "Concordo totalmente" },
    ];

    const GARGALO_CONTENT = {
      confianca: {
        title: "A voz que exige provar seu valor",
        body: "Sua raiz mais fina hoje é a autoconfiança. Não é falta de capacidade — é um padrão que aprende, cedo, que só se é aceito depois de provar algo. Isso trava a ação antes mesmo dela começar.",
        reflect: "Desde quando você sente que precisa provar seu valor antes de agir? O que aconteceria se você agisse mesmo sem essa prova?",
        steps: [
          "Escolha 1 ação pequena esta semana que você vem adiando por insegurança — e faça sem esperar se sentir “pronto”.",
          "No fim de cada dia, anote 1 vitória, por menor que pareça.",
          "Identifique 1 pessoa no seu círculo que fortalece sua confiança — e busque mais tempo perto dela.",
        ]
      },
      mentalidade: {
        title: "O medo do próprio sucesso",
        body: "Sua raiz mais fina é a mentalidade. Muitas vezes não é o fracasso que trava — é o medo do que a mudança exige de você. Crescer também assusta.",
        reflect: "O que você teme que aconteça se as coisas derem certo? Que responsabilidade nova isso traria?",
        steps: [
          "Escreva o pior cenário real de “dar certo” — e note o quanto dele é fato e o quanto é suposição.",
          "Na próxima vez que ouvir um “não”, escreva 1 informação útil que ele te deu.",
          "Escolha uma situação recente difícil e reescreva-a como aprendizado, não como derrota.",
        ]
      },
      atitude: {
        title: "O ciclo do desânimo",
        body: "Sua raiz mais fina é a atitude diária. O problema não é sentir desânimo — todo mundo sente. É o tempo que ele fica no comando antes de você retomar o volante.",
        reflect: "Quando o desânimo bate, o que ele te impede de fazer primeiro? O que costuma te tirar dali?",
        steps: [
          "Defina 1 hábito diário de 5 minutos (gratidão, caminhada, respiração) para os dias difíceis.",
          "Identifique o gatilho mais comum do seu desânimo e escreva 1 resposta padrão para ele.",
          "Reserve 1 pessoa de confiança para avisar quando perceber que está travando.",
        ]
      },
      acao: {
        title: "Sonho sem chão",
        body: "Sua raiz mais fina é a ação. As ideias existem, a vontade existe — o que falta é o passo concreto que tira o objetivo do campo da imaginação.",
        reflect: "O que você mais adia hoje? O que esse adiamento já te custou até agora?",
        steps: [
          "Pegue seu objetivo mais adiado e quebre-o em 1 passo que caiba nesta semana.",
          "Marque um prazo real — com data — para esse primeiro passo.",
          "Avise alguém sobre esse prazo, para criar compromisso externo.",
        ]
      }
    };

    // -------------------------------------------------------------------------
    // 2. ESTADO
    // -------------------------------------------------------------------------
    let state = {
      step: 'splash',      // splash, intro, quiz, result, reflect, paywall, checkin
      qIndex: 0,
      answers: {},
      ownAnswer: '',
      checkinDone: null,
      checkinNote: '',
      checkinSaved: false,
    };

    // -------------------------------------------------------------------------
    // 3. FUNÇÕES AUXILIARES
    // -------------------------------------------------------------------------
    function computeScores(answers) {
      const totals = { confianca: 0, mentalidade: 0, atitude: 0, acao: 0 };
      const counts = { confianca: 0, mentalidade: 0, atitude: 0, acao: 0 };
      QUESTIONS.forEach(q => {
        const raw = answers[q.id];
        if (raw == null) return;
        const val = q.reverse ? 6 - raw : raw;
        totals[q.pillar] += val;
        counts[q.pillar] += 1;
      });
      const scores = {};
      Object.keys(totals).forEach(k => {
        scores[k] = counts[k] ? totals[k] / counts[k] : 0;
      });
      return scores;
    }

    function getWeakest(scores) {
      let min = null, minVal = Infinity;
      Object.keys(scores).forEach(k => {
        if (scores[k] < minVal) { minVal = scores[k]; min = k; }
      });
      return min;
    }

    function getStrongest(scores, weakest) {
      let max = null, maxVal = -Infinity;
      Object.keys(scores).forEach(k => {
        if (k === weakest) return;
        if (scores[k] > maxVal) { maxVal = scores[k]; max = k; }
      });
      return max;
    }

    function getContent(weakest) {
      return weakest ? GARGALO_CONTENT[weakest] : null;
    }

    function getProgress() {
      if (state.step === 'quiz') return (state.qIndex / QUESTIONS.length) * 100;
      if (['result','reflect','paywall','checkin'].includes(state.step)) return 100;
      return 0;
    }

    // -------------------------------------------------------------------------
    // 4. RENDERIZAÇÃO
    // -------------------------------------------------------------------------
    function render() {
      const app = document.getElementById('app');
      if (!app) {
        console.error('Elemento #app não encontrado!');
        return;
      }

      try {
        const progress = getProgress();
        const scores = computeScores(state.answers);
        const weakest = getWeakest(scores);
        const strongest = getStrongest(scores, weakest);
        const content = getContent(weakest);
        const currentQ = QUESTIONS[state.qIndex];

        let html = '';

        // ---------- BARRA SUPERIOR (voltar + progresso) ----------
        const showBack = state.step !== 'splash';
        const showProgress = ['quiz','result','reflect','paywall','checkin'].includes(state.step);

        if (showBack) {
          html += `
            <div class="flex items-center gap-3 mb-6">
              <button onclick="goBack()" class="back-btn" aria-label="Voltar">‹</button>
              <span class="text-xs uppercase tracking-widest text-muted shrink-0">OVOM · Gargalo Mental</span>
              ${showProgress ? `<div class="flex-1 progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>` : ''}
            </div>
          `;
        }

        // ---------- TELAS ----------
        if (state.step === 'splash') {
          html += `
            <div class="text-center cursor-pointer" onclick="setStep('intro')">
              <h1 class="text-4xl font-bold mb-3">OVOM <span class="text-gold">Gargalo Mental</span></h1>
              <p class="text-lg italic text-gold max-w-md mx-auto mb-6">Existe uma raiz travando sua vida agora — e você ainda não sabe qual é.</p>
              <p class="text-xs uppercase text-muted tracking-widest animate-pulse">toque para começar</p>
            </div>
            <div class="text-center mt-8">
              <a href="https://instagram.com/eusoucarlosgomes01" target="_blank" class="text-xs text-muted underline hover-gold">Siga @eusoucarlosgomes01 no Instagram</a>
            </div>
          `;
        }

        else if (state.step === 'intro') {
          html += `
            <div class="text-center">
              <h1 class="text-3xl font-bold mb-4">OVOM <span class="text-gold">Gargalo Mental</span></h1>
              <p class="text-sm font-semibold text-gold mb-6">O teste que mostra onde a sua mente trava — e o que fazer para destravar.</p>
              <p class="text-base text-body max-w-md mx-auto mb-2">12 perguntas. Sem certo ou errado. O objetivo não é te avaliar — é mostrar qual raiz da sua vida está mais fraca hoje: confiança, mentalidade, atitude ou ação.</p>
              <p class="italic text-muted text-sm mb-3">“A venda mais importante não é a de um produto. É a de acreditar em si mesmo.”</p>
              <p class="text-xs uppercase tracking-widest text-muted mb-8">baseado no livro de Carlos Gomes</p>
              <button onclick="setStep('quiz')" class="btn-gold mx-auto">Começar diagnóstico</button>
            </div>
          `;
        }

        else if (state.step === 'quiz' && currentQ) {
          html += `
            <div>
              <span class="text-xs text-muted block mb-4">${String(state.qIndex+1).padStart(2,'0')} / ${String(QUESTIONS.length).padStart(2,'0')}</span>
              <h2 class="text-2xl font-semibold mb-8">${currentQ.text}</h2>
              <div class="flex flex-col gap-2">
                ${SCALE.map(s => `
                  <button onclick="selectAnswer(${s.v})" 
                    class="text-left px-4 py-3 border rounded-sm text-sm hover-border-gold transition-colors flex items-center justify-between"
                    style="background: ${state.answers[currentQ.id] === s.v ? 'rgba(201,162,39,0.15)' : '#141109'}; border-color: ${state.answers[currentQ.id] === s.v ? '#B8912B' : '#2B2619'}; color: #E4DDCC;">
                    <span>${s.label}</span>
                    <span class="text-xs text-muted">${s.v}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }

        else if (state.step === 'result' && content) {
          // Radar simplificado (sem SVG complexo, vou usar divs estilizadas)
          const order = ['confianca','mentalidade','atitude','acao'];
          const radarItems = order.map(k => ({
            key: k,
            label: PILLARS[k].label,
            value: scores[k],
            isWeakest: k === weakest,
            isStrongest: k === strongest,
          }));

          html += `
            <div>
              <div class="bg-card mb-6">
                <p class="text-xs uppercase tracking-widest text-muted text-center mb-2">Sua raiz mais fina agora</p>
                <h2 class="text-2xl font-bold text-center text-red">${content.title}</h2>
              </div>
              <div class="bg-card mb-6">
                <p class="text-sm text-body text-center">${content.body}</p>
                <p class="italic text-muted text-sm text-center mt-2">Isso não é quem você é — é onde você está agora. Toda raiz fina pode engrossar com prática.</p>
              </div>
              ${strongest ? `<p class="text-xs text-center text-muted mb-4">E uma raiz já vem firme: sua <span class="text-gold">${PILLARS[strongest].label}</span> está mais forte que o resto — vale se apoiar nela.</p>` : ''}
              
              <!-- Radar visual simples com barras -->
              <div class="bg-card mb-6">
                ${radarItems.map(item => `
                  <div class="flex items-center gap-3 mb-2">
                    <span class="text-sm text-muted w-24 shrink-0">${item.label}</span>
                    <div class="flex-1 h-2 bg-[#241F16] rounded-sm">
                      <div class="h-full rounded-sm" style="width:${(item.value/5)*100}%; background: ${item.isWeakest ? '#A23E2E' : item.isStrongest ? '#D4AF37' : '#B8912B'};"></div>
                    </div>
                    <span class="text-xs text-muted w-8 text-right">${item.value.toFixed(1)}</span>
                  </div>
                `).join('')}
              </div>

              <div class="flex flex-col items-center gap-3">
                <button onclick="setStep('reflect')" class="btn-gold">Ver a origem e o caminho</button>
                <button onclick="shareWhatsApp()" class="text-xs text-muted underline hover-gold">Compartilhar resultado no WhatsApp</button>
              </div>
            </div>
          `;
        }

        else if (state.step === 'reflect' && content) {
          html += `
            <div>
              <p class="text-xs uppercase tracking-widest text-muted mb-3">Origem — reflita antes de seguir</p>
              <p class="text-xl italic text-light mb-6">${content.reflect}</p>
              <textarea id="ownAnswer" placeholder="Se quiser, escreva sua resposta aqui (opcional)" class="w-full border p-3 text-sm h-20 resize-none mb-6">${state.ownAnswer}</textarea>
              <p class="text-xs uppercase tracking-widest text-muted mb-3">Caminho — primeiros passos</p>
              <ul class="step-list mb-6">
                ${content.steps.map((s, i) => `
                  <li><span>${i+1}</span><span class="text-body">${s}</span></li>
                `).join('')}
              </ul>
              <div class="flex flex-wrap gap-3">
                <button onclick="setStep('paywall')" class="btn-gold">Ver plano completo</button>
                <button onclick="restart()" class="btn-outline">Refazer diagnóstico</button>
              </div>
            </div>
          `;
        }

        else if (state.step === 'paywall') {
          html += `
            <div>
              <p class="text-xs uppercase tracking-widest text-muted text-center mb-3">Plano completo</p>
              <h2 class="text-3xl font-bold text-center mb-3">Acompanhe sua raiz <span class="text-gold">mês a mês</span></h2>
              <p class="text-sm text-body text-center max-w-md mx-auto mb-6">O diagnóstico gratuito mostra uma foto. O plano completo mostra a evolução — e te acompanha enquanto você trabalha o gargalo.</p>
              <div class="bg-card mb-6">
                ${[
                  ['Histórico do Mapa de Raízes', 'veja se a raiz mais fraca melhora mês a mês'],
                  ['Plano de 30 dias', 'passos detalhados, não só os 3 iniciais'],
                  ['Check-ins periódicos', 'o app pergunta se você deu o passo combinado'],
                  ['Biblioteca OVOM', 'trechos do livro liberados por gargalo'],
                  ['Reavaliação mensal', 'mini-diagnóstico pra medir sua evolução real'],
                ].map(([title, desc]) => `
                  <div class="benefit-item mb-2">
                    <span class="icon">✦</span>
                    <span><span class="text-light font-semibold">${title}</span> <span class="text-muted">— ${desc}</span></span>
                  </div>
                `).join('')}
              </div>
              <div class="text-center mb-6">
                <span class="text-3xl font-bold text-light">R$29,90</span>
                <span class="text-sm text-muted">/mês</span>
                <p class="text-xs text-muted">cancele quando quiser</p>
              </div>
              <div class="flex flex-col items-center gap-3">
                <button onclick="assinarPlano()" class="btn-gold">Assinar plano completo</button>
                <button onclick="setStep('reflect')" class="text-xs text-muted underline">voltar</button>
              </div>
            </div>
          `;
        }

        else if (state.step === 'checkin') {
          const done = state.checkinDone;
          const saved = state.checkinSaved;
          const stepText = content ? content.steps[0] : '';

          html += `
            <div>
              <p class="text-xs uppercase tracking-widest text-muted text-center mb-3">Semana 1 · ${content ? PILLARS[weakest].label : ''}</p>
              <h2 class="text-2xl font-bold text-center mb-6">Check-in</h2>
              ${content ? `
                <div class="bg-card mb-6">
                  <p class="text-xs uppercase tracking-widest text-muted mb-2">Passo combinado</p>
                  <p class="text-sm text-light">${stepText}</p>
                </div>
              ` : ''}
              <p class="text-sm text-body text-center mb-4">Você deu esse passo essa semana?</p>
              <div class="flex justify-center gap-3 mb-6">
                <button onclick="setCheckinDone(true)" class="checkin-btn ${done === true ? 'active-yes' : ''}">Dei o passo</button>
                <button onclick="setCheckinDone(false)" class="checkin-btn ${done === false ? 'active-no' : ''}">Ainda não</button>
              </div>
              ${done !== null && !saved ? `
                <div class="mb-6">
                  <textarea id="checkinNote" placeholder="${done ? 'Como foi? (opcional)' : 'O que travou? (opcional)'}" class="w-full border p-3 text-sm h-20 resize-none">${state.checkinNote}</textarea>
                  <div class="flex justify-center mt-3">
                    <button onclick="saveCheckin()" class="btn-gold">Salvar check-in</button>
                  </div>
                </div>
              ` : ''}
              ${saved ? `
                <div class="text-center mb-6">
                  <p class="text-lg italic text-gold mb-2">Check-in registrado.</p>
                  <p class="text-sm text-muted">Volte em 30 dias e refaça o diagnóstico para reavaliar sua raiz.</p>
                  <button onclick="startReassessment()" class="text-xs text-muted underline mt-3 hover-gold">Simular reavaliação agora (teste)</button>
                </div>
              ` : ''}
              <div class="flex justify-center">
                <button onclick="restart()" class="btn-outline">Refazer diagnóstico</button>
              </div>
            </div>
          `;
        }

        // Fallback caso step não seja reconhecido
        else {
          html = `<p class="text-red">Erro: passo desconhecido "${state.step}".</p>`;
        }

        app.innerHTML = html;
        console.log('Render OK - Step:', state.step);

      } catch (err) {
        console.error('Erro no render:', err);
        app.innerHTML = `<div style="color: #D9776A; padding: 2rem; text-align: center;">
          <h2>Ops, algo deu errado!</h2>
          <p>${err.message}</p>
          <p style="font-size:0.8rem;color:#93897A;">Abra o console (F12) para mais detalhes.</p>
        </div>`;
      }
    }

    // -------------------------------------------------------------------------
    // 5. AÇÕES
    // -------------------------------------------------------------------------
    function setStep(step) {
      console.log('setStep:', step);
      state.step = step;
      render();
    }

    function selectAnswer(val) {
      const q = QUESTIONS[state.qIndex];
      state.answers[q.id] = val;
      if (state.qIndex < QUESTIONS.length - 1) {
        state.qIndex++;
        render();
      } else {
        state.step = 'result';
        render();
      }
    }

    function goBack() {
      console.log('goBack from:', state.step);
      if (state.step === 'intro') { state.step = 'splash'; }
      else if (state.step === 'quiz') {
        if (state.qIndex > 0) { state.qIndex--; }
        else { state.step = 'intro'; }
      }
      else if (state.step === 'result') { state.step = 'quiz'; state.qIndex = QUESTIONS.length - 1; }
      else if (state.step === 'reflect') { state.step = 'result'; }
      else if (state.step === 'paywall') { state.step = 'reflect'; }
      else if (state.step === 'checkin') { state.step = 'paywall'; }
      render();
    }

    function restart() {
      console.log('Restarting...');
      state.answers = {};
      state.qIndex = 0;
      state.ownAnswer = '';
      state.checkinDone = null;
      state.checkinNote = '';
      state.checkinSaved = false;
      state.step = 'intro';
      render();
    }

    function shareWhatsApp() {
      const scores = computeScores(state.answers);
      const weakest = getWeakest(scores);
      const content = getContent(weakest);
      if (!content) return;
      const msg = `*OVOM · Gargalo Mental*\n\nMinha raiz mais fina hoje: *${PILLARS[weakest].label}*\n\n"${content.title}"\n\n${content.body}\n\nFaz o seu diagnóstico também 👇`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function assinarPlano() {
      const msg = `Olá! Fiz o diagnóstico OVOM Gargalo Mental e quero assinar o Plano Completo de R$ 29,90/mês.\n\nGostaria de receber as instruções para pagamento.`;
      window.open(`https://wa.me/5594992092395?text=${encodeURIComponent(msg)}`, '_blank');
      state.step = 'checkin';
      render();
    }

    function setCheckinDone(val) {
      state.checkinDone = val;
      render();
    }

    function saveCheckin() {
      const note = document.getElementById('checkinNote')?.value || '';
      state.checkinNote = note;
      state.checkinSaved = true;
      render();
    }

    function startReassessment() {
      state.answers = {};
      state.qIndex = 0;
      state.step = 'quiz';
      render();
    }

    // -------------------------------------------------------------------------
    // 6. INICIALIZAÇÃO COM LOG
    // -------------------------------------------------------------------------
    console.log('OVOM App iniciado.');
    render();
  </script>
</body>
</html>
