function computeScores(answers) {
  const totals = { confianca: 0, mentalidade: 0, atitude: 0, acao: 0 };
  const counts = { confianca: 0, mentalidade: 0, atitude: 0, acao: 0 };
  QUESTIONS.forEach((q) => {
    const raw = answers[q.id];
    if (raw == null) return;
    const val = q.reverse ? 6 - raw : raw;
    totals[q.pillar] += val;
    counts[q.pillar] += 1;
  });
  const scores = {};
  Object.keys(totals).forEach((k) => {
    scores[k] = counts[k] ? totals[k] / counts[k] : 0;
  });
  return scores;
}

function RootChart({ scores, weakest }) {
  const size = 280;
  const cx = size / 2;
  const cy = size / 2;
  const maxR = 100;
  const order = ["confianca", "mentalidade", "atitude", "acao"];
  const angleFor = (i) => (Math.PI * 2 * i) / order.length - Math.PI / 2;

  const points = order.map((k, i) => {
    const r = (scores[k] / 5) * maxR;
    const a = angleFor(i);
    return {
      key: k,
      x: cx + r * Math.cos(a),
      y: cy + r * Math.sin(a),
      labelX: cx + (maxR + 34) * Math.cos(a),
      labelY: cy + (maxR + 34) * Math.sin(a),
    };
  });

  const polygon = points.map((p) => `${p.x},${p.y}`).join(" ");
  const rings = [0.25, 0.5, 0.75, 1];

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="overflow-visible">
      {rings.map((r, i) => (
        <circle key={i} cx={cx} cy={cy} r={maxR * r} fill="none" stroke="#3A3427" strokeWidth="1" opacity="0.5" />
      ))}
      {order.map((k, i) => {
        const a = angleFor(i);
        return (
          <line key={k} x1={cx} y1={cy} x2={cx + maxR * Math.cos(a)} y2={cy + maxR * Math.sin(a)} stroke="#3A3427" strokeWidth="1" />
        );
      })}
      <polygon points={polygon} fill="rgba(201,162,39,0.18)" stroke="#B8912B" strokeWidth="2" />
      {points.map((p) => (
        <circle
          key={p.key}
          cx={p.x}
          cy={p.y}
          r={p.key === weakest ? 6 : 4}
          fill={p.key === weakest ? "#A23E2E" : "#D4AF37"}
          stroke={p.key === weakest ? "#E8B4A6" : "none"}
          strokeWidth={p.key === weakest ? 2 : 0}
        />
      ))}
      {points.map((p) => (
        <text
          key={p.key + "-label"}
          x={p.labelX}
          y={p.labelY}
          fill={p.key === weakest ? "#D9776A" : "#A89482"}
          fontSize="12"
          fontFamily="Inter, sans-serif"
          fontWeight={p.key === weakest ? 700 : 500}
          textAnchor="middle"
          dominantBaseline="middle"
        >
          {PILLARS[p.key].label}
        </text>
      ))}
    </svg>
  );
}

          onClick={(e) => e.stopPropagation()}
          style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }}
          className="fixed bottom-8 left-0 right-0 text-center text-xs underline hover:text-[#D4AF37] transition-colors"
        >
          Siga @eusoucarlosgomes01 no Instagram
        </a>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full flex items-center justify-center px-4 py-10" style={{ background: "#0B0A08" }}>
      <style>{FONTS}</style>
      <div className="w-full max-w-xl">
        <div className="flex items-center gap-3 mb-10">
          <button
            onClick={goBack}
            aria-label="Voltar"
            style={{ color: "#93897A" }}
            className="shrink-0 hover:text-[#D4AF37] transition-colors"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <span style={{ fontFamily: "Inter, sans-serif", color: "#93897A", letterSpacing: "0.18em" }} className="text-[10px] uppercase shrink-0">
            OVOM · Gargalo Mental
          </span>
          <div className="flex-1 h-[2px] relative" style={{ background: "#241F16" }}>
            <div
              className="h-full absolute left-0 top-0 transition-all duration-500"
              style={{ width: `${progress}%`, background: "linear-gradient(90deg,#6B5217,#D4AF37)" }}
            />
          </div>
        </div>

        {step === "intro" && (
          <div className="text-center">
            <div className="flex justify-center mb-8">
              <img
                src={COVER_IMG}
                alt="Capa do livro Ou Vende ou Morre, de Carlos Gomes"
                className="w-32 sm:w-36 rounded-sm shadow-2xl"
                style={{ boxShadow: "0 20px 40px -10px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,162,39,0.3)" }}
              />
            </div>
            <h1 style={{ fontFamily: "Fraunces, serif", color: "#F3ECDD" }} className="text-4xl sm:text-5xl leading-[1.1] font-semibold mb-3">
              OVOM <span style={{ color: "#B8912B" }}>Gargalo Mental</span>
            </h1>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#B8912B" }} className="text-sm sm:text-base font-semibold tracking-wide mb-6">
              O teste que mostra onde a sua mente trava — e o que fazer para destravar.
            </p>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#B7AF9F" }} className="text-base leading-relaxed mb-2 max-w-md mx-auto">
              12 perguntas. Sem certo ou errado. O objetivo não é te avaliar —
              é mostrar qual raiz da sua vida está mais fraca hoje: confiança,
              mentalidade, atitude ou ação.
            </p>
            <p style={{ fontFamily: "Fraunces, serif", color: "#5F594B" }} className="text-sm italic mb-3">
              &ldquo;A venda mais importante não é a de um produto. É a de acreditar em si mesmo.&rdquo;
            </p>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#5F594B" }} className="text-xs mb-10 uppercase tracking-widest">
              baseado no livro de Carlos Gomes
            </p>
            <button
              onClick={() => setStep("quiz")}
              style={{ fontFamily: "Inter, sans-serif", background: "#B8912B", color: "#0B0A08" }}
              className="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm hover:bg-[#D4AF37] transition-colors"
            >
              Começar diagnóstico
            </button>
          </div>
        )}

        {step === "quiz" && currentQ && (
          <div>
            <span style={{ fontFamily: "Inter, sans-serif", color: "#5F594B" }} className="text-xs mb-4 block">
              {String(qIndex + 1).padStart(2, "0")} / {String(QUESTIONS.length).padStart(2, "0")}
            </span>
            <h2 style={{ fontFamily: "Fraunces, serif", color: "#F3ECDD" }} className="text-2xl sm:text-3xl leading-snug font-medium mb-10 min-h-[5rem]">
              {currentQ.text}
            </h2>
            <div className="flex flex-col gap-2">
              {SCALE.map((s) => (
                <button
                  key={s.v}
                  onClick={() => selectAnswer(s.v)}
                  style={{
                    fontFamily: "Inter, sans-serif",
                    background: answers[currentQ.id] === s.v ? "rgba(201,162,39,0.15)" : "#141109",
                    borderColor: answers[currentQ.id] === s.v ? "#B8912B" : "#2B2619",
                    color: "#E4DDCC",
                  }}
                  className="text-left px-5 py-3 border rounded-sm text-sm hover:border-[#B8912B] transition-colors flex items-center justify-between"
                >
                  <span>{s.label}</span>
                  <span style={{ color: "#5F594B" }} className="text-xs">{s.v}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {step === "result" && content && (
          <div>
            <div className="flex justify-center mb-8">
              <RootChart scores={scores} weakest={weakest} />
            </div>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-xs uppercase tracking-widest text-center mb-2">
              Sua raiz mais fina agora
            </p>
            <h2 style={{ fontFamily: "Fraunces, serif", color: "#D9776A" }} className="text-3xl font-semibold text-center mb-6">
              {content.title}
            </h2>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#B7AF9F" }} className="text-base leading-relaxed mb-4 text-center max-w-md mx-auto">
              {content.body}
            </p>
            <p style={{ fontFamily: "Fraunces, serif", color: "#5F594B" }} className="text-sm italic text-center mb-2 max-w-md mx-auto">
              Isso não é quem você é — é onde você está agora. Toda raiz fina pode engrossar com prática.
            </p>
            {strongest && (
              <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-xs text-center mb-8 max-w-md mx-auto">
                E uma raiz já vem firme: sua <span style={{ color: "#D4AF37" }}>{PILLARS[strongest].label}</span> está mais forte que o resto — vale se apoiar nela.
              </p>
            )}
            <div className="flex flex-col items-center gap-3">
              <button
                onClick={() => setStep("reflect")}
                style={{ fontFamily: "Inter, sans-serif", background: "#B8912B", color: "#0B0A08" }}
                className="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm hover:bg-[#D4AF37] transition-colors"
              >
                Ver a origem e o caminho
              </button>
              <button
                onClick={shareWhatsApp}
                style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }}
                className="text-xs underline hover:text-[#D4AF37] transition-colors flex items-center gap-1"
              >
                Compartilhar resultado no WhatsApp
              </button>
            </div>
          </div>
        )}

        {step === "reflect" && content && (
          <div>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-xs uppercase tracking-widest mb-3">
              Origem — reflita antes de seguir
            </p>
            <p style={{ fontFamily: "Fraunces, serif", color: "#F3ECDD" }} className="text-2xl leading-snug italic mb-6">
              {content.reflect}
            </p>
            <textarea
              value={ownAnswer}
              onChange={(e) => setOwnAnswer(e.target.value)}
              placeholder="Se quiser, escreva sua resposta aqui (opcional)"
              style={{ fontFamily: "Inter, sans-serif", background: "#141109", borderColor: "#2B2619", color: "#E4DDCC" }}
              className="w-full border rounded-sm p-3 text-sm h-20 resize-none mb-10"
            />

            <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-xs uppercase tracking-widest mb-3">
              Caminho — primeiros passos
            </p>
            <ul className="mb-10 flex flex-col gap-3">
              {content.steps.map((s, i) => (
                <li key={i} className="flex gap-3 items-start">
                  <span style={{ color: "#B8912B", fontFamily: "Fraunces, serif" }} className="text-sm font-semibold shrink-0 mt-0.5">
                    {i + 1}
                  </span>
                  <span style={{ fontFamily: "Inter, sans-serif", color: "#B7AF9F" }} className="text-sm leading-relaxed">
                    {s}
                  </span>
                </li>
              ))}
            </ul>

            <div className="flex flex-wrap gap-3">
              <button
                onClick={() => setStep("paywall")}
                style={{ fontFamily: "Inter, sans-serif", background: "#B8912B", color: "#0B0A08" }}
                className="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm hover:bg-[#D4AF37] transition-colors"
              >
                Ver plano completo
              </button>
              <button
                onClick={restart}
                style={{ fontFamily: "Inter, sans-serif", borderColor: "#3A2A1E", color: "#93897A" }}
                className="px-6 py-3 text-sm border rounded-sm hover:border-[#B8912B] hover:text-[#D4AF37] transition-colors"
              >
                Refazer diagnóstico
              </button>
            </div>
          </div>
        )}

        {step === "paywall" && content && (
          <div>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-xs uppercase tracking-widest mb-3 text-center">
              Plano completo
            </p>
            <h2 style={{ fontFamily: "Fraunces, serif", color: "#F3ECDD" }} className="text-3xl font-semibold text-center mb-3">
              Acompanhe sua raiz <span style={{ color: "#B8912B" }}>mês a mês</span>
            </h2>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#B7AF9F" }} className="text-sm leading-relaxed text-center mb-10 max-w-md mx-auto">
              O diagnóstico gratuito mostra uma foto. O plano completo mostra a evolução —
              e te acompanha enquanto você trabalha o gargalo.
            </p>

            <ul className="mb-10 flex flex-col gap-4 max-w-md mx-auto">
              {[
                ["Histórico do Mapa de Raízes", "veja se a raiz mais fraca melhora mês a mês"],
                ["Plano de 30 dias", "passos detalhados, não só os 3 iniciais"],
                ["Check-ins periódicos", "o app pergunta se você deu o passo combinado"],
                ["Biblioteca OVOM", "trechos do livro liberados por gargalo"],
                ["Reavaliação mensal", "mini-diagnóstico pra medir sua evolução real"],
              ].map(([title, desc], i) => (
                <li key={i} className="flex gap-3 items-start">
                  <span style={{ color: "#B8912B" }} className="text-sm shrink-0 mt-0.5">✦</span>
                  <span style={{ fontFamily: "Inter, sans-serif" }}>
                    <span style={{ color: "#F3ECDD" }} className="text-sm font-semibold">{title}</span>
                    <span style={{ color: "#93897A" }} className="text-sm"> — {desc}</span>
                  </span>
                </li>
              ))}
            </ul>

            <div className="text-center mb-8">
              <span style={{ fontFamily: "Fraunces, serif", color: "#F3ECDD" }} className="text-4xl font-semibold">
                R$29,90
              </span>
              <span style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-sm">/mês</span>
              <p style={{ fontFamily: "Inter, sans-serif", color: "#5F594B" }} className="text-xs mt-1">
                cancele quando quiser
              </p>
            </div>

            <div className="flex flex-col items-center gap-3">
              <button
                onClick={() => setStep("account")}
                style={{ fontFamily: "Inter, sans-serif", background: "#B8912B", color: "#0B0A08" }}
                className="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm hover:bg-[#D4AF37] transition-colors w-full max-w-xs"
              >
                Assinar plano completo
              </button>
              <button
                onClick={() => setStep("reflect")}
                style={{ fontFamily: "Inter, sans-serif", color: "#5F594B" }}
                className="text-xs underline"
              >
                voltar
              </button>
            </div>
          </div>
        )}

        {step === "account" && content && (
          <div>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-xs uppercase tracking-widest mb-3 text-center">
              Quase lá
            </p>
            <h2 style={{ fontFamily: "Fraunces, serif", color: "#F3ECDD" }} className="text-3xl font-semibold text-center mb-3">
              Crie sua conta
            </h2>
            <p style={{ fontFamily: "Inter, sans-serif", color: "#B7AF9F" }} className="text-sm leading-relaxed text-center mb-8 max-w-md mx-auto">
              É com esses dados que você acessa seu histórico depois, e recebe o link do grupo exclusivo no WhatsApp assim que o pagamento for confirmado.
            </p>

            <div className="flex flex-col gap-3 max-w-sm mx-auto mb-8">
              <input
                type="text"
                placeholder="Nome completo"
                value={accountData.name}
                onChange={(e) => setAccountData({ ...accountData, name: e.target.value })}
                style={{ fontFamily: "Inter, sans-serif", background: "#141109", borderColor: "#2B2619", color: "#E4DDCC" }}
                className="w-full border rounded-sm p-3 text-sm"
              />
              <input
                type="email"
                placeholder="E-mail"
                value={accountData.email}
                onChange={(e) => setAccountData({ ...accountData, email: e.target.value })}
                style={{ fontFamily: "Inter, sans-serif", background: "#141109", borderColor: "#2B2619", color: "#E4DDCC" }}
                className="w-full border rounded-sm p-3 text-sm"
              />
              <input
                type="tel"
                placeholder="WhatsApp (com DDD)"
                value={accountData.whatsapp}
                onChange={(e) => setAccountData({ ...accountData, whatsapp: e.target.value })}
                style={{ fontFamily: "Inter, sans-serif", background: "#141109", borderColor: "#2B2619", color: "#E4DDCC" }}
                className="w-full border rounded-sm p-3 text-sm"
              />
            </div>

            <div className="flex flex-col items-center gap-3">
              <button
                onClick={() => setStep("checkin")}
                style={{ fontFamily: "Inter, sans-serif", background: "#B8912B", color: "#0B0A08" }}
                className="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm hover:bg-[#D4AF37] transition-colors w-full max-w-sm"
              >
                Continuar para pagamento
              </button>
              <button
                onClick={() => setStep("paywall")}
                style={{ fontFamily: "Inter, sans-serif", color: "#5F594B" }}
                className="text-xs underline"
              >
                voltar
              </button>
            </div>
          </div>
        )}

        {step === "checkin" && content && (
          <CheckinScreen weakest={weakest} content={content} restart={restart} startReassessment={startReassessment} />
        )}

        {step === "comparison" && content && (
          <ComparisonScreen
            scores={scores}
            weakest={weakest}
            content={content}
            prevScores={prevScores}
            prevWeakest={prevWeakest}
            restart={restart}
          />
        )}
      </div>
    </div>
  );
}

function ComparisonScreen({ scores, weakest, content, prevScores, prevWeakest, restart }) {
  const order = ["confianca", "mentalidade", "atitude", "acao"];
  return (
    <div>
      <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-xs uppercase tracking-widest mb-3 text-center">
        Reavaliação · 30 dias depois
      </p>
      <h2 style={{ fontFamily: "Fraunces, serif", color: "#F3ECDD" }} className="text-2xl font-semibold text-center mb-8">
        Sua evolução
      </h2>

      <div className="flex flex-col gap-3 mb-8 max-w-md mx-auto">
        {order.map((k) => {
          const before = prevScores ? prevScores[k] : 0;
          const after = scores[k];
          const delta = after - before;
          const arrow = delta > 0.2 ? "↑" : delta < -0.2 ? "↓" : "→";
          const color = delta > 0.2 ? "#7A9A4A" : delta < -0.2 ? "#A23E2E" : "#93897A";
          return (
            <div key={k} className="flex items-center justify-between border-b pb-2" style={{ borderColor: "#2B2619" }}>
              <span style={{ fontFamily: "Inter, sans-serif", color: "#E4DDCC" }} className="text-sm">
                {PILLARS[k].label}
              </span>
              <span style={{ fontFamily: "Inter, sans-serif", color: "#5F594B" }} className="text-xs">
                {before.toFixed(1)} → {after.toFixed(1)}
              </span>
              <span style={{ fontFamily: "Inter, sans-serif", color }} className="text-sm font-semibold w-5 text-right">
                {arrow}
              </span>
            </div>
          );
        })}
      </div>

      <p style={{ fontFamily: "Fraunces, serif", color: "#F3ECDD" }} className="text-lg text-center italic mb-2 max-w-md mx-auto">
        {prevWeakest === weakest
          ? `Sua raiz mais fina continua sendo ${PILLARS[weakest].label} — é onde vale insistir.`
          : `Sua raiz mais fina mudou de ${PILLARS[prevWeakest].label} para ${PILLARS[weakest].label}.`}
      </p>

      <div className="flex justify-center mt-8">
        <button
          onClick={restart}
          style={{ fontFamily: "Inter, sans-serif", borderColor: "#3A2A1E", color: "#93897A" }}
          className="px-6 py-3 text-sm border rounded-sm hover:border-[#B8912B] hover:text-[#D4AF37] transition-colors"
        >
          Refazer diagnóstico
        </button>
      </div>
    </div>
  );
}

function CheckinScreen({ weakest, content, restart, startReassessment }) {
  const [done, setDone] = useState(null);
  const [note, setNote] = useState("");
  const [saved, setSaved] = useState(false);

  return (
    <div>
      <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-xs uppercase tracking-widest mb-3 text-center">
        Semana 1 · {PILLARS[weakest].label}
      </p>
      <h2 style={{ fontFamily: "Fraunces, serif", color: "#F3ECDD" }} className="text-2xl font-semibold text-center mb-8">
        Check-in
      </h2>

      <div className="rounded-sm border p-5 mb-8" style={{ borderColor: "#2B2619", background: "#141109" }}>
        <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-xs uppercase tracking-widest mb-2">
          Passo combinado
        </p>
        <p style={{ fontFamily: "Inter, sans-serif", color: "#E4DDCC" }} className="text-sm leading-relaxed">
          {content.steps[0]}
        </p>
      </div>

      <p style={{ fontFamily: "Inter, sans-serif", color: "#B7AF9F" }} className="text-sm mb-4 text-center">
        Você deu esse passo essa semana?
      </p>
      <div className="flex gap-3 justify-center mb-8">
        <button
          onClick={() => setDone(true)}
          style={{
            fontFamily: "Inter, sans-serif",
            background: done === true ? "rgba(184,145,43,0.15)" : "#141109",
            borderColor: done === true ? "#B8912B" : "#2B2619",
            color: "#E4DDCC",
          }}
          className="px-6 py-2 border rounded-sm text-sm hover:border-[#B8912B] transition-colors"
        >
          Dei o passo
        </button>
        <button
          onClick={() => setDone(false)}
          style={{
            fontFamily: "Inter, sans-serif",
            background: done === false ? "rgba(162,62,46,0.15)" : "#141109",
            borderColor: done === false ? "#A23E2E" : "#2B2619",
            color: "#E4DDCC",
          }}
          className="px-6 py-2 border rounded-sm text-sm hover:border-[#A23E2E] transition-colors"
        >
          Ainda não
        </button>
      </div>

      {done !== null && !saved && (
        <div className="mb-8">
          <textarea
            value={note}
            onChange={(e) => setNote(e.target.value)}
            placeholder={done ? "Como foi? (opcional)" : "O que travou? (opcional)"}
            style={{ fontFamily: "Inter, sans-serif", background: "#141109", borderColor: "#2B2619", color: "#E4DDCC" }}
            className="w-full border rounded-sm p-3 text-sm h-20 resize-none"
          />
          <div className="flex justify-center mt-4">
            <button
              onClick={() => setSaved(true)}
              style={{ fontFamily: "Inter, sans-serif", background: "#B8912B", color: "#0B0A08" }}
              className="px-8 py-3 text-sm font-semibold tracking-wide rounded-sm hover:bg-[#D4AF37] transition-colors"
            >
              Salvar check-in
            </button>
          </div>
        </div>
      )}

      {saved && (
        <div className="text-center mb-8">
          <p style={{ fontFamily: "Fraunces, serif", color: "#D4AF37" }} className="text-lg italic mb-2">
            Check-in registrado.
          </p>
          <p style={{ fontFamily: "Inter, sans-serif", color: "#93897A" }} className="text-sm">
            Volte em 30 dias e refaça o diagnóstico para reavaliar sua raiz.
          </p>
          <button
            onClick={startReassessment}
            style={{ fontFamily: "Inter, sans-serif", color: "#5F594B" }}
            className="text-xs underline mt-3 hover:text-[#D4AF37] transition-colors"
          >
            Simular reavaliação agora (teste)
          </button>
        </div>
      )}

      <div className="flex justify-center">
        <button
          onClick={restart}
          style={{ fontFamily: "Inter, sans-serif", borderColor: "#3A2A1E", color: "#93897A" }}
          className="px-6 py-3 text-sm border rounded-sm hover:border-[#B8912B] hover:text-[#D4AF37] transition-colors"
        >
          Refazer diagnóstico
        </button>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
